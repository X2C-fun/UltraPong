[package]
name = "ultrapong"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "ultrapong"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "vrf"] }
magicblock-magic-program-api = { version = "=0.14.10", default-features = false }
bincode = "1.3"
borsh = "1.6.0"
ultrapong-physics = { path = "../../crates/physics" }
[lints.rust]
unexpected_cfgs = { level = "allow" }
